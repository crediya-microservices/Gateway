server:
  port: 8080
spring:
  application:
    name: "Gateway"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
routes:
  services:
    autenticacion: http://localhost:8081
    solicitudes: http://localhost:8082
jwt:
  secret: "Aa5592770*1234567890abcdef12345678"
  expiration-ms: 3600000